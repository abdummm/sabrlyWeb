<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body style="margin: 0; overflow: hidden;">

<div style="
    position: relative;
    width: 100%;
    height: 100vh;
    background-color: white;
    background-image: radial-gradient(black 1px, transparent 1px);
    background-size: 20px 20px;
">

    <!-- Image + text centered -->
    <div style="position: absolute; left: 50%; top: 35%; transform: translate(-50%, -50%); text-align: center;">
        <img
                src="Sabrly_image.webp"
                alt="Sabrly logo"
                width="300"
                height="300"
                style="
                border-radius: 30%;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
                background-color: white;
                padding: 8px;
                user-select: none;
                -webkit-user-select: none;
                -webkit-user-drag: none;
                display: block;
                margin: 0 auto;
            "
        >
        <h1 style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
            Sabrly - Islamic Content Creation Made Easy
        </h1>
    </div>

    <!-- Buttons at 80% vertically -->
    <div style="position: absolute; left: 50%; top: 80%; transform: translate(-50%, -50%); text-align: center;">
        <div style="margin-bottom: 8px;">
            <button style="background-color: black; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 8px; width: 320px;">
                Download for Mac
            </button>
        </div>
        <div>
            <button style="background-color: black; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 8px; width: 320px;">
                Download for Windows
            </button>
        </div>
    </div>

</div>

</body>
</html>
