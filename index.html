<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sabrly</title>
    <link rel="icon" href="Resources/Sabrly_image.webp" type="image/png">
</head>
<body style="margin: 0; overflow: hidden;">

<div style="
    position: relative;
    width: 100%;
    height: 100vh;
    background-color: white;
    background-image: radial-gradient(black 1px, transparent 1px);
    background-size: 20px 20px;
">

    <!-- Image + text centered -->
    <div style="position: absolute; left: 50%; top: 35%; transform: translate(-50%, -50%); text-align: center; width: 100vw">
        <img
                src="Resources/Sabrly_image.webp"
                alt="Sabrly logo"
                width="300"
                height="300"
                style="
                border-radius: 30%;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
                background-color: white;
                padding: 8px;
                user-select: none;
                -webkit-user-select: none;
                -webkit-user-drag: none;
                display: block;
                margin: 0 auto;
                z-index: 100;
                position: relative;
            "
        >
        <h1 style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: white; z-index : 1; position: relative; display: inline-block;">
            Sabrly - Islamic Content Creation Made Easy
        </h1>
    </div>

    <!-- Buttons at 80% vertically -->
    <div style="position: absolute; left: 50%; top: 80%; transform: translate(-50%, -50%); text-align: center;">
        <div style="margin-bottom: 8px;">
            <button id="download_for_mac" style="background-color: black; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 8px; width: 320px;">
                Download for Mac
            </button>
        </div>
        <div>
            <button id="download_for_windows" style="background-color: #888; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: not-allowed; border-radius: 8px; width: 320px;" disabled>
                Download for Windows - coming soon
            </button>
        </div>
    </div>

    <div style="position: absolute; left: 50%; top: 95%; transform: translate(-50%, -50%); background: white;display: flex; gap: 10px; justify-content: center; align-items: center;">
        <p style="font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
            Made on Earth by Humans
        </p>
        <img src="Resources/linkedin_logo.svg" style="width:16px; height: 16px; fill: black" alt="Linkedin logo">
        <a  href="https://linkedin.com/in/abdummm" target="_blank"
           style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: black;">LinkedIn</a>
        <img src="Resources/github-logo.svg" style="width:16px; height: 16px; fill: black" alt="Github logo">
        <a href="https://github.com/abdummm" target="_blank"
           style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: black;">Github</a>
        <img src="Resources/mail_icon.svg" style="width:16px; height: 16px; fill: black" alt="Mail logo">
        <a href="mailto:sabrlydev@gmail.com"
           style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: black;">
            sabrlydev@gmail.com
        </a>
    </div>

</div>

</body>
</html>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MS1BCDSNXQ"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-MS1BCDSNXQ');
    document.getElementById('download_for_mac').addEventListener('click', () => {
        gtag('event', 'download_for_mac_clicked');
    });
    document.getElementById('download_for_windows').addEventListener('click', () => {
        gtag('event', 'download_for_windows_clicked');
    });
    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            if (link.href === "https://linkedin.com/in/abdummm") {
                gtag('event', 'web_linkedin_clicked');
            } else if (link.href === "https://github.com/abdummm") {
                gtag('event', 'web_github_clicked');
            } else if (link.href === "mailto:sabrlydev@gmail.com") {
                gtag('event', 'web_sabrly_dev_mail_clicked');
            }
        });
    });
</script>
